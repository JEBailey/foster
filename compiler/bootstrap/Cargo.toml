[package]
name = "foster-bootstrap"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Compile the same implementation for the build host, without depending on its
# generated library. This breaks the compiler -> bundled library -> compiler cycle.
[lib]
path = "../src/lib.rs"
test = false
doctest = false

[features]
test-support = []
compiler-profile = []

[dependencies]
foster-bytecode = { path = "../../bytecode" }
foster-host = { path = "../../host" }
ariadne = "0.6"
camino = "1.2"
cranelift-codegen = "0.134.3"
cranelift-frontend = "0.134.3"
cranelift-module = "0.134.3"
cranelift-native = "0.134.3"
cranelift-object = "0.134.3"
la-arena = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"

[dev-dependencies]
foster-vm = { path = "../../vm" }
