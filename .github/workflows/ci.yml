name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      packages: ${{ steps.plan.outputs.packages }}
      suites: ${{ steps.plan.outputs.suites }}
      ownership: ${{ steps.plan.outputs.ownership }}
      parity: ${{ steps.plan.outputs.parity }}
      editor: ${{ steps.plan.outputs.editor }}
      benchmarks: ${{ steps.plan.outputs.benchmarks }}
      benchmark_rust: ${{ steps.plan.outputs.benchmark_rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate test registration and CI selection
        run: python -m unittest discover -s tools/ci/tests -v
      - name: Select affected components
        id: plan
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/ci/plan.py --base "$DIFF_BASE" --github-output "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy ${{ needs.changes.outputs.packages }} --all-targets --profile test -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FOSTER_NATIVE_CACHE_DIR: ${{ github.workspace }}/target/native-runtime-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
      - uses: actions/cache@v4
        with:
          path: target/native-runtime-cache
          key: native-runtime-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('runtime/**', 'host/src/**', 'bytecode/src/native/abi.rs', 'compiler/src/native/runtime*.rs') }}
          restore-keys: native-runtime-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: Component unit tests and examples
        run: cargo test ${{ needs.changes.outputs.packages }} --lib --bins --examples
      - name: Selected integration suites (two targets in parallel)
        if: needs.changes.outputs.suites != ''
        run: python tools/integration_tests.py --jobs 2 --suite ${{ needs.changes.outputs.suites }}
      - name: Component documentation tests
        run: cargo test ${{ needs.changes.outputs.packages }} --doc
      - name: Release backend parity
        if: needs.changes.outputs.parity == 'true'
        run: cargo test --release --test backend_parity

  ownership-gates:
    needs: changes
    if: needs.changes.outputs.ownership == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ownership
      - run: cargo test --test ownership_soundness
      - run: cargo test --release --test ownership_soundness

  editor:
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: editor
      - name: Build compiler for real debugger sessions
        working-directory: .
        run: cargo build --profile test --bin foster
      - run: npm run test:run-debug

  benchmark-checks:
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/ci/check_harnesses.py
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.benchmark_rust == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.benchmark_rust == 'true'
        with:
          shared-key: benchmark-checks
      - name: Compile Rust benchmark harnesses
        if: needs.changes.outputs.benchmark_rust == 'true'
        run: cargo check -p foster --benches --examples --profile test
