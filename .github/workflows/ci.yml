name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FOSTER_NATIVE_CACHE_DIR: ${{ github.workspace }}/target/native-runtime-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
      - uses: actions/cache@v4
        with:
          path: target/native-runtime-cache
          key: native-runtime-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('runtime/**', 'host/src/**', 'compiler/src/native/abi.rs', 'compiler/src/native/runtime*.rs') }}
          restore-keys: native-runtime-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - run: cargo test
      - run: cargo test --release --test backend_parity

  ownership-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ownership
      - run: cargo test --test ownership_soundness
      - run: cargo test --release --test ownership_soundness
