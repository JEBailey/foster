[package]
name = "foster"
version = "0.1.0"
edition = "2024"
autotests = false
description = "The bootstrap implementation of the Foster programming language"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
# Opt-in allocator instrumentation for compiler profiling builds.
compiler-profile = ["foster-compiler/compiler-profile"]

[[bin]]
name = "foster"
path = "src/main.rs"

[dependencies]
zip = { version = "4", default-features = false, features = ["deflate"] }

foster-compiler = { path = "compiler" }
foster-bytecode = { path = "bytecode" }
foster-vm = { path = "vm" }
foster-host = { path = "host" }
foster-native-runtime = { path = "runtime" }
camino = "1.2"
clap = "4.6.6"
crossbeam-channel = "0.5"
lsp-server = "0.10"
lsp-types = "0.97"
pulldown-cmark = "0.13.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"

[dev-dependencies]
foster-compiler = { path = "compiler", features = ["test-support"] }
criterion = { version = "0.8.2", features = ["html_reports"] }

[build-dependencies]
foster-compiler = { path = "compiler" }
cc = "1"

[[bench]]
name = "compiler"
harness = false

[[bench]]
name = "runtime"
harness = false


# Integration targets are grouped by component; target names stay usable with --test.

